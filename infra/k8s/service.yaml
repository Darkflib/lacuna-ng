# Production recommendations:
# - For production, use type: LoadBalancer with cloud provider annotations
# - Consider using an Ingress controller for advanced routing
# - Set up DDoS protection and rate limiting at the load balancer level
# - Enable logging and monitoring for the load balancer
# - Configure health checks to match your readiness probes
