[project]
name = "lacuna_compiler"
version = "2.0.0-dev"
description = "YAML to Caddy JSON compiler for Lacuna v2"
requires-python = ">=3.11"
dependencies = [
    "lacuna_schema",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
]

[project.scripts]
lacuna-compiler = "lacuna_compiler.cli:app"

[tool.uv.sources]
lacuna_schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacuna_compiler"]
