[project]
name = "lacuna_promote"
version = "2.0.0-dev"
description = "Double-buffer config promotion for Lacuna v2"
requires-python = ">=3.11"
dependencies = [
    "lacuna_schema",
    "lacuna_compiler",
    "requests>=2.31.0"
]

[tool.uv.sources]
lacuna_schema = { workspace = true }
lacuna_compiler = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "types-requests>=2.31.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacuna_promote"]
