[project]
name = "lacuna_schema"
version = "2.0.0-dev"
description = "YAML schema validation for Lacuna v2 redirection service"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "hypothesis>=6.0.0",
    "types-pyyaml>=6.0.0",
    "types-requests>=2.32.4.20250913",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacuna_schema"]
