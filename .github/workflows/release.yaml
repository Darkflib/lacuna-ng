---
name: Release

'on':
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false  # a release shouldn't build from a cache other refs can write

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linters
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type check
        run: uv run mypy packages/ tools/ --strict

      - name: Run tests
        run: uv run pytest -v --cov

      - name: Validate examples
        run: |
          uv run python -m lacuna_schema.check examples/domainlist.yaml
          uv run python -m lacuna_schema.check examples/minimal.yaml

  build-docker:
    name: Build Multi-Arch Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    permissions:
      contents: read
      packages: write
      security-events: write  # upload-sarif
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}/lacuna-caddy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: infra/Dockerfile.caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          image-ref: 'ghcr.io/${{ github.repository }}/lacuna-caddy:${{ steps.version.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-docker
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # Tag name, commit subjects and repo name reach the shell only as data
      # (env and a file), never as ${{ }} expanded into the script.
      - name: Write release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog from $PREV_TAG to $GITHUB_REF_NAME"
            COMMITS=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges)
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}/lacuna-caddy"
          BLOB="https://github.com/${GITHUB_REPOSITORY}"
          {
            echo "## Lacuna v2 - Release ${VERSION}"
            echo
            echo "### Docker Images"
            echo
            echo "Multi-architecture images are available on GitHub Container Registry:"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo "docker pull ${IMAGE}:latest"
            echo '```'
            echo
            # shellcheck disable=SC2016  # literal backticks for Markdown
            echo '**Supported architectures**: `linux/amd64`, `linux/arm64`'
            echo
            echo "### Changes"
            echo
            printf '%s\n' "$COMMITS"
            echo
            echo "### Installation"
            echo
            echo "**Using Docker Compose:**"
            echo
            echo '```yaml'
            echo "services:"
            echo "  lacuna:"
            echo "    image: ${IMAGE}:${VERSION}"
            echo "    ports:"
            echo '      - "80:80"'
            echo '      - "443:443"'
            echo "    volumes:"
            echo "      - ./config:/srv/lacuna/config"
            echo "      - ./data:/data"
            echo "    restart: unless-stopped"
            echo '```'
            echo
            echo "**Using Kubernetes:**"
            echo
            echo "See the [k8s/ directory](${BLOB}/tree/main/infra/k8s)"
            echo "for example manifests."
            echo
            echo "### Documentation"
            echo
            echo "- [Project README](${BLOB}/blob/main/README.md)"
            echo "- [Agent Documentation](${BLOB}/blob/main/AGENTS.md)"
            echo "- [Project Structure](${BLOB}/blob/main/PROJECT_STRUCTURE.md)"
          } > "$RUNNER_TEMP/notes.md"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # actions/create-release is archived; gh is on every runner.
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Release $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

