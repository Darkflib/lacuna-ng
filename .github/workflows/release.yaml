---
name: Release

'on':
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run linters
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run type check
        run: uv run mypy packages/ tools/ --strict

      - name: Run tests
        run: uv run pytest -v --cov

      - name: Validate examples
        run: |
          uv run python -m lacuna_schema.check examples/domainlist.yaml
          uv run python -m lacuna_schema.check examples/minimal.yaml

  build-docker:
    name: Build Multi-Arch Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/lacuna-caddy
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}/lacuna-caddy:${{ steps.version.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, using all commits"
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            echo "Generating changelog from $PREV_TAG to ${{ github.ref_name }}"
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ steps.version.outputs.version }}
          body: |
            ## Lacuna v2 - Release ${{ steps.version.outputs.version }}

            ### Docker Images

            Multi-architecture images are available on GitHub Container Registry:

            ```bash
            docker pull ghcr.io/${{ github.repository }}/lacuna-caddy:${{ steps.version.outputs.version }}
            docker pull ghcr.io/${{ github.repository }}/lacuna-caddy:latest
            ```

            **Supported architectures**: `linux/amd64`, `linux/arm64`

            ### Changes

            ${{ steps.changelog.outputs.commits }}

            ### Installation

            **Using Docker Compose:**

            ```yaml
            services:
              lacuna:
                image: ghcr.io/${{ github.repository }}/lacuna-caddy:${{ steps.version.outputs.version }}
                ports:
                  - "80:80"
                  - "443:443"
                volumes:
                  - ./config:/srv/lacuna/config
                  - ./data:/data
                restart: unless-stopped
            ```

            **Using Kubernetes:**

            See the [k8s/ directory](https://github.com/${{ github.repository }}/tree/main/infra/k8s)
            for example manifests.

            ### Documentation

            - [Project README](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [Agent Documentation](https://github.com/${{ github.repository }}/blob/main/AGENTS.md)
            - [Project Structure](https://github.com/${{ github.repository }}/blob/main/PROJECT_STRUCTURE.md)
          draft: false
          prerelease: false

