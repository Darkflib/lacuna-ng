---
name: CI

'on':
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: YAML lint
        run: uv run yamllint .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install workspace packages
        run: uv pip install -e packages/lacuna_schema -e packages/lacuna_compiler -e packages/lacuna_promote -e tools/lacuna_sim

      - name: MyPy strict type check
        run: uv run mypy packages/ tools/ --strict

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install workspace packages
        run: uv pip install -e packages/lacuna_schema -e packages/lacuna_compiler -e packages/lacuna_promote -e tools/lacuna_sim

      - name: Run tests with coverage
        run: uv run pytest -v --cov --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

      - name: Coverage summary
        run: uv run pytest --cov --cov-report=term-missing

  validate:
    name: Validate Examples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install workspace packages
        run: uv pip install -e packages/lacuna_schema -e packages/lacuna_compiler -e packages/lacuna_promote -e tools/lacuna_sim

      - name: Validate domainlist.yaml
        run: uv run python -m lacuna_schema check examples/domainlist.yaml

      - name: Validate minimal.yaml
        run: uv run python -m lacuna_schema check examples/minimal.yaml

      - name: Compile domainlist.yaml (validate-only)
        run: |
          mkdir -p ./test-output
          uv run lacuna-compiler examples/domainlist.yaml --out-dir ./test-output --validate-only

      - name: Compile minimal.yaml (validate-only)
        run: |
          mkdir -p ./test-output
          uv run lacuna-compiler examples/minimal.yaml --out-dir ./test-output --validate-only

      - name: Simulate redirects with cases
        run: uv run lacuna-sim --yaml examples/domainlist.yaml --cases examples/cases.txt

      - name: Check for dead rules
        run: |
          output=$(uv run lacuna-sim --yaml examples/domainlist.yaml --cases examples/cases.txt 2>&1)
          echo "$output"
          if echo "$output" | grep -qE "Dead rules \(never matched\)"; then
            echo "ERROR: Dead rules detected"
            exit 1
          fi
          echo "SUCCESS: No dead rules detected"

      - name: Upload compiled configs
        uses: actions/upload-artifact@v5
        with:
          name: compiled-configs
          path: ./test-output/*.json
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, typecheck, test, validate]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      security-events: write
      actions: read
    steps:
      - name: Set lowercase repo name
        id: repo
        run: echo "repository=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.repository }}/lacuna-caddy
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Docker image (test)
        if: github.ref != 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.caddy
          platforms: linux/amd64
          push: false
          tags: lacuna-caddy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (main branch)
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.caddy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.repository }}/lacuna-caddy:latest
            ghcr.io/${{ steps.repo.outputs.repository }}/lacuna-caddy:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner (image)
        if: github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: 'ghcr.io/${{ steps.repo.outputs.repository }}/lacuna-caddy:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy image results
        if: github.ref == 'refs/heads/main'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-image-results.sarif'

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, validate, security]
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "Lint job failed"
            exit 1
          fi
          if [ "${{ needs.typecheck.result }}" != "success" ]; then
            echo "Type check job failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test job failed"
            exit 1
          fi
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "Validate job failed"
            exit 1
          fi
          echo "All required CI checks passed!"
