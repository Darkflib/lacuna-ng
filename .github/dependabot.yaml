---
version: 2
updates:
  # Python dependencies via pip (uv uses pip-compatible format)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "lacuna-team"
    assignees:
      - "lacuna-team"
    # Group minor and patch updates together
    groups:
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "pytest*"
          - "mypy"
          - "ruff"
          - "black"
      dev-tools:
        patterns:
          - "pytest*"
          - "mypy"
          - "ruff"
          - "black"
          - "pre-commit"
          - "hypothesis"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "lacuna-team"
    assignees:
      - "lacuna-team"

  # Docker dependencies (if using base images in Dockerfile)
  - package-ecosystem: "docker"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "lacuna-team"
    assignees:
      - "lacuna-team"
