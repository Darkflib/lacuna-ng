[project]
name = "lacuna_sim"
version = "2.0.0-dev"
description = "Dry-run simulator for Lacuna v2 redirect configurations"
requires-python = ">=3.12"
authors = [{ name = "Lacuna Team" }]
dependencies = [
    "lacuna_schema",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "pytest-cov>=4.1.0"
]

[project.scripts]
lacuna-sim = "lacuna_sim.cli:app"

[tool.uv.sources]
lacuna_schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacuna_sim"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
